version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    install:
      - python -m pip install uv
      - uv sync --locked --group docs
    build:
      html:
        - uv run --locked --group docs zensical build --clean --strict
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a site/. "$READTHEDOCS_OUTPUT/html/"
