version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    install:
      - uv sync --locked --only-group docs
    build:
      html:
        - uv run --locked --only-group docs zensical build --clean --strict
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a site/. "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    # Enable Read the Docs' native uv toolchain. The custom install job above
    # retains strict lockfile checking and excludes project runtime dependencies.
    - method: uv
      command: sync
      groups:
        - docs
