[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchrir"
version = "3.0.3"
description = "PyTorch-based room impulse response (RIR) simulation toolkit for static and dynamic scenes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.4,<3.14"
dependencies = [
  "numpy>=2.2.6",
  "torch>=2.10.0",
]

[project.optional-dependencies]
audio = ["soundfile>=0.13.1"]
cli = ["pyyaml>=6.0.2"]
hpf = ["scipy>=1.14.0"]
viz = [
  "matplotlib>=3.10.8",
  "pillow>=11.2.1",
  "scienceplots>=2.1.1",
]
datasets = [
  "matplotlib>=3.10.8",
  "pillow>=11.2.1",
  "scienceplots>=2.1.1",
  "soundfile>=0.13.1",
]
oobss = ["oobss>=0.1.0"]
all = [
  "matplotlib>=3.10.8",
  "oobss>=0.1.0",
  "pillow>=11.2.1",
  "pyyaml>=6.0.2",
  "scienceplots>=2.1.1",
  "scipy>=1.14.0",
  "soundfile>=0.13.1",
]

[project.urls]
Changelog = "https://github.com/taishi-n/torchrir/blob/main/CHANGELOG.md"
Documentation = "https://torchrir.readthedocs.io/en/latest/"
Repository = "https://github.com/taishi-n/torchrir"

[project.scripts]
torchrir-build-dynamic-cmu-arctic = "torchrir.datasets.dynamic_cmu_arctic:main"

[dependency-groups]
quality = ["ruff>=0.12.2", "ty>=0.0.14,<0.1"]
dev = [
  {include-group = "quality"},
  "commitizen>=3.29.0",
  "git-cliff>=2.10.1",
  "matplotlib>=3.10.8",
  "pillow>=11.2.1",
]
docs = [
  "zensical>=0.0.51",
  "mkdocstrings-python>=2.0.2",
]
test = [
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "scipy>=1.14.0",
  "soundfile>=0.13.1",
]
comparison = ["pyroomacoustics==0.9.0"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
filterwarnings = ["error"]
markers = [
  "unit: fast, isolated unit tests",
  "numerical: numerical correctness and physical invariant tests",
  "comparison: tests requiring an external reference implementation",
  "cuda: tests requiring a CUDA device",
  "mps: tests requiring an Apple MPS device",
  "slow: tests excluded from the fastest local feedback loop",
]

[tool.coverage.run]
branch = true
source = ["torchrir"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
pre_bump_hooks = ["uv lock"]

[tool.setuptools.packages.find]
where = ["src"]
