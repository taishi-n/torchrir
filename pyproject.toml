[project]
name = "torchrir"
version = "0.9.0"
description = "PyTorch-based room impulse response (RIR) simulation toolkit for static and dynamic scenes."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.2.6",
  "torch>=2.10.0",
  "scipy>=1.14.0",
]

[project.optional-dependencies]
audio = ["soundfile>=0.13.1"]
viz = [
  "matplotlib>=3.10.8",
  "pillow>=11.2.1",
  "scienceplots>=2.1.1",
]
datasets = [
  "matplotlib>=3.10.8",
  "pillow>=11.2.1",
  "scienceplots>=2.1.1",
  "soundfile>=0.13.1",
]
oobss = ["oobss>=0.1.0"]
all = [
  "matplotlib>=3.10.8",
  "oobss>=0.1.0",
  "pillow>=11.2.1",
  "scienceplots>=2.1.1",
  "soundfile>=0.13.1",
]

[project.urls]
Repository = "https://github.com/taishi-n/torchrir"

[project.scripts]
torchrir-build-dynamic-cmu-arctic = "torchrir.datasets.dynamic_cmu_arctic:main"

[dependency-groups]
dev = [
  "commitizen>=3.29.0",
  "git-cliff>=2.10.1",
  "matplotlib>=3.10.8",
  "pillow>=11.2.1",
  "ruff>=0.12.2",
  "ty>=0.0.14,<0.1",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.0",
  "mkdocstrings[python]>=0.30.0",
  "mkdocs-autorefs>=1.4.0",
  "pymdown-extensions>=10.16.0",
]
test = ["pytest>=9.0.2", "soundfile>=0.13.1"]
comparison = ["pyroomacoustics>=0.9.0"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
pre_bump_hooks = ["uv lock"]
