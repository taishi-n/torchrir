name: ci

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".readthedocs.yaml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "MANIFEST.in"
      - "NOTICE"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "examples/**"
      - "zensical.toml"
      - "README.md"
  pull_request:

permissions:
  contents: read

env:
  UV_PYTHON: "3.11.4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.workflow == 'ci' }}

jobs:
  docs:
    name: Documentation (minimal dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --only-group docs
      - run: uv run --locked --only-group docs zensical build --clean --strict
      - name: Verify generated documentation
        run: >-
          uv run --locked --only-group docs python -c "from pathlib import Path;
          required=(Path('site/index.html'), Path('site/api.html'));
          assert all(path.is_file() and path.stat().st_size > 0
          for path in required), required;
          text=Path('site/api.html').read_text(encoding='utf-8');
          forbidden=('_resolve_simulation_config', '_load_audio',
          '_validate_wav_path', '__all__');
          assert not any(name in text for name in forbidden), forbidden"

  quality:
    name: Lint, types, and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --no-default-groups --group quality --group test --extra viz --extra cli
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ty check
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflows and shell scripts
        run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint"

  test:
    name: CPU (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11.4", coverage: true}
          - {os: ubuntu-latest, python: "3.12", coverage: false}
          - {os: ubuntu-latest, python: "3.13", coverage: false}
          - {os: macos-latest, python: "3.13", coverage: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --no-default-groups --group test --extra viz --extra cli
      - name: Verify test interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import sys

          expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          actual = sys.version_info[: len(expected)]
          print(f"Requested Python {expected}; running {sys.version}")
          if actual != expected:
              raise SystemExit(f"Python version mismatch: {actual} != {expected}")
          PY
      - name: Install codecs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install codecs on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - run: ffmpeg -version && ffprobe -version
      - name: CPU tests with execution report
        shell: bash
        env:
          COVERAGE: ${{ matrix.coverage }}
          MPLBACKEND: Agg
        run: |
          coverage_args=()
          if [[ "$COVERAGE" == true ]]; then
            coverage_args=(--cov=torchrir --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml)
          fi
          uv run --no-sync pytest -q -rs -m 'not comparison and not cuda and not mps' --ignore-glob='tests/test_compare_*.py' --junitxml=reports/cpu.xml "${coverage_args[@]}"
          uv run --no-sync python scripts/check_test_report.py reports/cpu.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
          if-no-files-found: warn

  comparison:
    name: Pinned CPU reference comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --no-default-groups --group test --group comparison
      - run: uv pip install 'rir-generator==0.3.0'
      - name: Compare both pinned references (no skips)
        env:
          TORCHRIR_REQUIRE_COMPARISON: "1"
          TORCHRIR_REQUIRE_RIR_GENERATOR_COMPARISON: "1"
        run: |
          uv run --no-sync pytest -q -rs tests/test_compare_pyroomacoustics.py tests/test_compare_rir_generator.py --junitxml=reports/comparison.xml
          uv run --no-sync python scripts/check_test_report.py reports/comparison.xml --no-skips
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-comparison
          path: reports/
          if-no-files-found: warn

  distribution:
    name: Build and installed-wheel validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Verify release inputs
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/check_distribution.py --tag "$RELEASE_TAG"
      - name: Exercise installed wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/wheel-base"
          uv venv "$RUNNER_TEMP/wheel-extras"
          wheel=$(realpath dist/*.whl)
          uv pip install --python "$RUNNER_TEMP/wheel-base/bin/python" "$wheel"
          uv pip install --python "$RUNNER_TEMP/wheel-extras/bin/python" "${wheel}[audio,datasets,cli]"
          cp scripts/smoke_wheel.py "$RUNNER_TEMP/smoke_wheel.py"
          cd "$RUNNER_TEMP"
          ./wheel-base/bin/python -I smoke_wheel.py
          ./wheel-extras/bin/python -I smoke_wheel.py --extras
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
