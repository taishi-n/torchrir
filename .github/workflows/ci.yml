name: ci

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".readthedocs.yaml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "MANIFEST.in"
      - "NOTICE"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "zensical.toml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".readthedocs.yaml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "MANIFEST.in"
      - "NOTICE"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "zensical.toml"
      - "README.md"

jobs:
  docs:
    name: Documentation (minimal dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --only-group docs
      - run: uv run --locked --only-group docs zensical build --clean --strict
      - name: Verify generated documentation
        run: >-
          uv run --locked --only-group docs python -c "from pathlib import Path;
          required=(Path('site/index.html'), Path('site/api.html'));
          assert all(path.is_file() and path.stat().st_size > 0
          for path in required), required;
          text=Path('site/api.html').read_text(encoding='utf-8');
          forbidden=('_resolve_simulation_config', '_load_audio',
          '_validate_wav_path', '__all__');
          assert not any(name in text for name in forbidden), forbidden"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.4", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group test --extra audio --extra viz
      - run: uv run pytest -q --cov=torchrir --cov-branch --cov-report=term-missing

  quality:
    name: Lint, type, comparisons, and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: TORCHRIR_REQUIRE_COMPARISON=1 uv run pytest -q tests/test_compare_pyroomacoustics.py
      - name: Compare against rir-generator 0.3.0
        env:
          TORCHRIR_REQUIRE_RIR_GENERATOR_COMPARISON: "1"
        run: uv run --with 'rir-generator==0.3.0' pytest -q tests/test_compare_rir_generator.py
      - run: uv build
      - name: Verify release inputs
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: uv run --no-sync python scripts/check_distribution.py --tag "$RELEASE_TAG"
      - run: uv venv /tmp/torchrir-wheel-smoke
      - run: uv pip install --python /tmp/torchrir-wheel-smoke/bin/python dist/*.whl
      - run: /tmp/torchrir-wheel-smoke/bin/python -c "import torchrir; from torchrir.sim import simulate"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
